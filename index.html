<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low Poly World — Built with Hermes</title>
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML = '<div style="color:#ff3333;background:#111;padding:40px;font-family:monospace;z-index:9999;position:absolute;top:0;left:0;width:100%;height:100%;overflow:auto;"><h2>JavaScript Error:</h2><pre>' + e.message + '\nat ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n\nStack:\n' + (e.error ? e.error.stack : 'N/A') + '</pre></div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML = '<div style="color:#ff3333;background:#111;padding:40px;font-family:monospace;z-index:9999;position:absolute;top:0;left:0;width:100%;height:100%;overflow:auto;"><h2>Unhandled Promise Rejection:</h2><pre>' + e.reason + '</pre></div>';
    });
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #ui {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      color: #fff; font-size: 14px;
      background: rgba(0,0,0,0.5); padding: 16px 22px;
      border-radius: 12px; backdrop-filter: blur(8px);
    }
    #ui h1 { font-size: 18px; margin-bottom: 6px; font-weight: 600; }
    #ui p { opacity: 0.7; font-size: 13px; line-height: 1.5; }
    #ui kbd {
      background: #fff2; padding: 2px 8px; border-radius: 4px;
      font-family: monospace; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>🌍 Low Poly World</h1>
    <p>
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move<br/>
      <kbd>Ctrl</kbd> Run &middot; <kbd>Space</kbd> Jump<br/>
      <kbd>Shift</kbd> Switch Shiftlock Mode<br/>
      <kbd>Mouse</kbd> Look around
    </p>
    <div id="shiftlock-indicator" style="margin-top: 8px; font-size: 12px; font-weight: bold; color: #ffcc00; letter-spacing: 0.5px;">
      Shiftlock: Off (None)
    </div>
  </div>

  <!-- Load Three.js with robust CDN fallbacks (essential when jsDelivr is blocked by DNS/adblockers) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      console.warn('jsDelivr failed to load Three.js, attempting unpkg fallback...');
      document.write('<script src="https://unpkg.com/three@0.164.1/build/three.min.js"><\/script>');
    }
  </script>
  <script>
    if (typeof THREE === 'undefined') {
      console.warn('unpkg failed to load Three.js, attempting cdnjs fallback...');
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>

  <script>

  // ── Scene Setup ──────────────────────────────────────────
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7ec8e3);
  scene.fog = new THREE.FogExp2(0x7ec8e3, 0.008);

  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  // ── Lights ───────────────────────────────────────────────
  const sun = new THREE.DirectionalLight(0xfff4e0, 2);
  sun.position.set(50, 80, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 400;
  sun.shadow.camera.left = -200;
  sun.shadow.camera.right = 200;
  sun.shadow.camera.top = 200;
  sun.shadow.camera.bottom = -200;
  scene.add(sun);

  scene.add(new THREE.HemisphereLight(0x87ceeb, 0x3a7d2c, 0.6));
  scene.add(new THREE.AmbientLight(0x404060, 0.3));

  // ── Low-Poly Terrain ─────────────────────────────────────
  const terrainSize = 400;
  const terrainSegs = 80;
  const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegs, terrainSegs);
  const verts = terrainGeo.attributes.position;
  for (let i = 0; i < verts.count; i++) {
    const x = verts.getX(i), y = verts.getY(i);
    const dist = Math.sqrt(x * x + y * y);
    let h = (Math.sin(x * 0.05) * Math.cos(y * 0.07) * 3 +
             Math.sin(x * 0.12 + y * 0.09) * 2 +
             Math.random() * 0.3);
    // Flatten center area for player start
    if (dist < 10) h *= dist / 10;
    verts.setZ(i, h);
  }
  terrainGeo.computeVertexNormals();

  // Low-poly coloring by height
  const colors = [];
  for (let i = 0; i < verts.count; i++) {
    const h = verts.getZ(i);
    let c;
    if (h < -1.5) c = new THREE.Color(0x5a3a1a);    // low ground
    else if (h < 0) c = new THREE.Color(0x4a7c3f);     // grass
    else if (h < 2) c = new THREE.Color(0x5cb85c);     // light grass
    else if (h < 4) c = new THREE.Color(0x7bc950);     // high grass
    else c = new THREE.Color(0x8fbc8f);                // hill top
    colors.push(c.r, c.g, c.b);
  }
  terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const terrainMat = new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, roughness: 0.9
  });
  const terrain = new THREE.Mesh(terrainGeo, terrainMat);
  terrain.rotation.x = -Math.PI / 2;
  terrain.receiveShadow = true;
  scene.add(terrain);

  // ── Water (flat blue plane) ──────────────────────────────
  const water = new THREE.Mesh(
    new THREE.CircleGeometry(300, 5),
    new THREE.MeshStandardMaterial({ color: 0x5b91c6, flatShading: true, transparent: true, opacity: 0.8 })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = -2;
  scene.add(water);

  // ── Low-Poly Tree Generator ──────────────────────────────
  function createTree(x, z) {
    const g = new THREE.Group();

    // Trunk sits ON the terrain, not at center
    const trunkH = 0.8 + Math.random() * 0.8;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.20, trunkH, 5),
      new THREE.MeshStandardMaterial({ color: 0x8b5a2b, flatShading: true })
    );
    trunk.position.y = trunkH / 2;
    trunk.castShadow = true;
    g.add(trunk);

    // Foliage layers
    const foliagePalettes = [0x2d8b4a, 0x3aa85e, 0x2e7d32, 0x4caf50, 0x388e3c];
    const layers = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < layers; i++) {
      const r = (layers - i) * 0.5 + Math.random() * 0.2;
      const h = r * 1.4;
      const mat = new THREE.MeshStandardMaterial({
        color: foliagePalettes[Math.floor(Math.random() * foliagePalettes.length)],
        flatShading: true
      });
      const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 5 + Math.floor(Math.random() * 3)), mat);
      cone.position.y = trunkH + h / 2 + i * h * 0.5;
      cone.castShadow = true;
      g.add(cone);
    }

    // Position tree so its base sits on the terrain
    const ty = getTerrainHeight(x, z);
    g.position.set(x, ty, z);

    // Rotate tree to match the terrain normal with a gentle tilt so it grows mostly upwards (not bugged/falling over)
    const normal = getTerrainNormal(x, z);
    const dampedNormal = new THREE.Vector3(normal.x * 0.2, normal.y, normal.z * 0.2).normalize();
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dampedNormal);

    return g;
  }

  // ── Utility: get terrain height at (x,z) with bilinear interpolation ─
  function getTerrainHeight(x, z) {
    const half = terrainSize / 2;
    const seg = terrainSize / terrainSegs;
    const col = (x + half) / seg;
    const row = (z + half) / seg;
    const ci = Math.floor(col), ri = Math.floor(row);
    const cf = col - ci, rf = row - ri;
    const ci2 = Math.min(ci + 1, terrainSegs);
    const ri2 = Math.min(ri + 1, terrainSegs);
    const clamp = (i, j) => {
      if (i < 0 || i > terrainSegs || j < 0 || j > terrainSegs) return 0;
      return verts.getZ(j * (terrainSegs + 1) + i);
    };
    const h00 = clamp(ci, ri), h10 = clamp(ci2, ri);
    const h01 = clamp(ci, ri2), h11 = clamp(ci2, ri2);
    const h0 = h00 * (1 - cf) + h10 * cf;
    const h1 = h01 * (1 - cf) + h11 * cf;
    return h0 * (1 - rf) + h1 * rf;
  }

    // ── Terrain normal: tilt player to match slope ─────────────
  function getTerrainNormal(x, z) {
    const s = 0.8; // wider sample = more stable normals
    const hl = getTerrainHeight(x - s, z);
    const hr = getTerrainHeight(x + s, z);
    const hf = getTerrainHeight(x, z - s);
    const hb = getTerrainHeight(x, z + s);
    const dx = (hr - hl) / (s * 2);
    const dz = (hf - hb) / (s * 2);
    return new THREE.Vector3(-dx, 1, dz).normalize();
  }

  // ── Scatter Trees, Rocks, Flowers ────────────────────────
  const treePositions = [];
  for (let i = 0; i < 600; i++) {
    const tx = (Math.random() - 0.5) * 365;
    const tz = (Math.random() - 0.5) * 365;
    const td = Math.sqrt(tx * tx + tz * tz);
    if (td < 5) continue; // keep center clear
    if (td < 80 && Math.random() > 0.7) continue;

    if (Math.random() < 0.85) {
      const terrainH = getTerrainHeight(tx, tz);
      const normal = getTerrainNormal(tx, tz);
      
      // Enforce spawning rules:
      // 1. Cannot spawn on water (height <= -1.5)
      // 2. Cannot spawn on steep ground (slope > 30 degrees, normal.y < 0.866)
      if (terrainH > -1.5 && normal.y >= 0.866) {
        scene.add(createTree(tx, tz));
        treePositions.push({ x: tx, z: tz });
      }
    } else {
      // Rock
      const rockSize = 0.5 + Math.random() * 1;
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(rockSize, 0),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(0, 0, 0.3 + Math.random() * 0.3),
          flatShading: true
        })
      );
      const rockY = Math.max(getTerrainHeight(tx, tz) + rockSize, -1.5);
      rock.position.set(tx, rockY, tz);
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      rock.castShadow = true;
      scene.add(rock);
    }
  }

  // Flowers
  const petalGeo = new THREE.DodecahedronGeometry(0.15, 0);
  const flowerColors = [0xff6b9d, 0xffd700, 0xff4444, 0xffffff, 0xbb88ee, 0xff9944];
  for (let i = 0; i < 500; i++) {
    const angle = Math.random() * Math.PI * 2;
    const distF = 5 + Math.random() * 180;
    const fx = Math.cos(angle) * distF;
    const fz = Math.sin(angle) * distF;

    // Stem, sitting properly on terrain
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.02, 0.4, 3),
      new THREE.MeshStandardMaterial({ color: 0x3a7d2c, flatShading: true })
    );
    const flowerY = Math.max(getTerrainHeight(fx, fz), -1.5);
    stem.position.set(fx, flowerY + 0.2, fz);
    scene.add(stem);

    // Petals
    const petal = new THREE.Mesh(
      petalGeo,
      new THREE.MeshStandardMaterial({
        color: flowerColors[Math.floor(Math.random() * flowerColors.length)],
        flatShading: true
      })
    );
    petal.position.set(fx, flowerY + 0.5, fz);
    scene.add(petal);
  }

  // ── Clouds ───────────────────────────────────────────────
  function createCloud() {
    const g = new THREE.Group();
    const count = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
      const cb = new THREE.Mesh(
        new THREE.DodecahedronGeometry(2 + Math.random() * 3, 1),
        new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.9 })
      );
      cb.position.set(i * 3 - count, Math.random() * 1, Math.random() * 2);
      g.add(cb);
    }
    g.position.set(
      (Math.random() - 0.5) * 200,
      30 + Math.random() * 15,
      (Math.random() - 0.5) * 200
    );
    g.userData.speed = 0.2 + Math.random() * 0.5;
    return g;
  }
  const clouds = [];
  for (let i = 0; i < 12; i++) {
    const cloud = createCloud();
    clouds.push(cloud);
    scene.add(cloud);
  }

  // ── Player Character ─────────────────────────────────────
  const player = new THREE.Group();
  const PLAYER_RADIUS = 0.4;   // collision radius
  const PLAYER_HEIGHT = 2.2;   // collision height (ground to hat top)
  const FEET_OFFSET = 0.0;     // hover clearance so feet don't clip into slopes

  // Body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.2, 0.4),
    new THREE.MeshStandardMaterial({ color: 0x4488cc, flatShading: true })
  );
  body.position.y = 0.6;
  body.castShadow = true;
  player.add(body);

  // Head
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.5, 0.5),
    new THREE.MeshStandardMaterial({ color: 0xffcc99, flatShading: true })
  );
  head.position.y = 1.45;
  head.castShadow = true;
  player.add(head);

  // Hat
  const hat = new THREE.Mesh(
    new THREE.ConeGeometry(0.35, 0.5, 4),
    new THREE.MeshStandardMaterial({ color: 0xe74c3c, flatShading: true })
  );
  hat.position.y = 1.95;
  hat.castShadow = true;
  player.add(hat);

  player.position.set(0, getTerrainHeight(0, 0) + FEET_OFFSET, 0);
  scene.add(player);

  // ── Controls ─────────────────────────────────────────────
  const keys = {};
  const velocity = new THREE.Vector3();
  let yaw = 0, pitch = 0;
  let isLocked = false;
  let shiftlockMode = 0; // 0 = None, 1 = Smooth Lock, 2 = Instant Lock
  
  function updateShiftlockUI() {
    const el = document.getElementById('shiftlock-indicator');
    if (!el) return;
    if (shiftlockMode === 0) {
      el.textContent = 'Shiftlock: Off (None)';
      el.style.color = '#ffcc00';
    } else if (shiftlockMode === 1) {
      el.textContent = 'Shiftlock: Mode 1 (Smooth)';
      el.style.color = '#00ffcc';
    } else if (shiftlockMode === 2) {
      el.textContent = 'Shiftlock: Mode 2 (Instant)';
      el.style.color = '#ff3366';
    }
  }

  document.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    
    // Cycle Shiftlock modes on Shift press (without trigger repetition when holding key)
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
      if (!e.repeat) {
        shiftlockMode = (shiftlockMode + 1) % 3;
        updateShiftlockUI();
      }
    }
  });
  
  document.addEventListener('keyup', e => { keys[e.code] = false; });

  renderer.domElement.addEventListener('click', () => {
    renderer.domElement.requestPointerLock();
  });

  document.addEventListener('pointerlockchange', () => {
    isLocked = document.pointerLockElement === renderer.domElement;
  });

  document.addEventListener('mousemove', e => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.002;
      pitch = Math.max(-0.6, Math.min(1.2, pitch + e.movementY * 0.002));
    });

  // ── Game Loop ────────────────────────────────────────────
  const clock = new THREE.Clock();
  let vy = 0; // vertical velocity (jump)

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    // Clouds drift
    for (const c of clouds) {
      c.position.x += c.userData.speed * dt;
      if (c.position.x > 100) c.position.x = -100;
    }

    // Player movement
    const speed = keys['ControlLeft'] ? 12 : 6;
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

    const move = new THREE.Vector3();
    if (keys['KeyW'] || keys['ArrowUp']) move.add(forward);
    if (keys['KeyS'] || keys['ArrowDown']) move.sub(forward);
    if (keys['KeyA'] || keys['ArrowLeft']) move.sub(right);
    if (keys['KeyD'] || keys['ArrowRight']) move.add(right);

    if (move.length() > 0) {
      move.normalize();

    }

    velocity.x = move.x * speed;
    velocity.z = move.z * speed;

    // Move horizontally FIRST so we check terrain at the destination
    player.position.x += velocity.x * dt;
    player.position.z += velocity.z * dt;

    // Keep in bounds
    player.position.x = Math.max(-terrainSize/2 + 2, Math.min(terrainSize/2 - 2, player.position.x));
    player.position.z = Math.max(-terrainSize/2 + 2, Math.min(terrainSize/2 - 2, player.position.z));

    // Tree collisions (cylinder-based check around the trunks)
    const playerRadius = 0.4;
    const trunkCollisionRadius = 0.5; // Slightly larger than tree trunks for smooth navigation
    const minCollisionDist = playerRadius + trunkCollisionRadius;
    for (const tree of treePositions) {
      const dx = player.position.x - tree.x;
      const dz = player.position.z - tree.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < minCollisionDist) {
        // Push the player outward to prevent clipping
        const angle = Math.atan2(dz, dx);
        player.position.x = tree.x + Math.cos(angle) * minCollisionDist;
        player.position.z = tree.z + Math.sin(angle) * minCollisionDist;
      }
    }

    // ── Jump & Gravity (hitbox-aware) ─────────────────────
    // groundY is where the character's feet sit (group origin = feet)
    const groundY = getTerrainHeight(player.position.x, player.position.z);
    const terrainNormal = getTerrainNormal(player.position.x, player.position.z);

    // Apply gravity only when above ground clearance
    if (player.position.y > groundY + FEET_OFFSET + 0.01) {
      vy -= 22 * dt;
    }

    // Jump (only when feet are on terrain, using a wider 0.35 threshold for sprint jumping)
    if (keys['Space'] && vy === 0 && Math.abs(player.position.y - groundY - FEET_OFFSET) < 0.35) {
      vy = 8;
    }

    player.position.y += vy * dt;

    // Anti fall-through: clamp to terrain + clearance
    if (player.position.y < groundY + FEET_OFFSET) {
      player.position.y = groundY + FEET_OFFSET;
      vy = 0;
    }

    // Rotate player to align with terrain slope & Shiftlock mode settings
    const targetQuat = new THREE.Quaternion().setFromUnitVectors(
      new THREE.Vector3(0, 1, 0), terrainNormal
    );
    
    if (shiftlockMode === 0) {
      // NONE MODE: Character turning is disabled unless moving
      if (move.length() > 0.01) {
        // Turn smoothly to face walking direction
        const targetYaw = Math.atan2(-move.x, -move.z);
        const yawQuat = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(0, 1, 0), targetYaw
        );
        const combined = targetQuat.clone().multiply(yawQuat);
        player.quaternion.slerp(combined, 10 * dt);
      } else {
        // Standing still: Align with slope normal, preserve current character model yaw
        const currentEuler = new THREE.Euler().setFromQuaternion(player.quaternion, 'YXZ');
        const yawQuat = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(0, 1, 0), currentEuler.y
        );
        const combined = targetQuat.clone().multiply(yawQuat);
        player.quaternion.slerp(combined, 10 * dt);
      }
    } else if (shiftlockMode === 1) {
      // SHIFTLOCK 1: Smooth lock to face camera direction (yaw + PI)
      const yawQuat = new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(0, 1, 0), yaw + Math.PI
      );
      const combined = targetQuat.clone().multiply(yawQuat);
      player.quaternion.slerp(combined, 8 * dt);
    } else if (shiftlockMode === 2) {
      // SHIFTLOCK 2: Instant lock to face camera direction (yaw + PI)
      const yawQuat = new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(0, 1, 0), yaw + Math.PI
      );
      const combined = targetQuat.clone().multiply(yawQuat);
      player.quaternion.copy(combined);
    }

    // ── Spherical Camera Follow with Roblox-style Terrain & Obstacle Collision ──
    const targetPos = new THREE.Vector3();
    head.getWorldPosition(targetPos); // Follow the exact world position of the head, adapting to slope tilts!

    const maxRadius = 6.0; // Desired distance
    
    // Direction vector from target to camera (using pitch and yaw)
    // pitch acts as the elevation angle, yaw acts as the azimuthal angle
    const dx = Math.sin(yaw) * Math.cos(pitch) * maxRadius;
    const dy = Math.sin(pitch) * maxRadius;
    const dz = Math.cos(yaw) * Math.cos(pitch) * maxRadius;
    
    let targetRadius = maxRadius;
    const collisionSteps = 12;
    
    for (let i = 1; i <= collisionSteps; i++) {
      const t = i / collisionSteps;
      const checkX = targetPos.x + dx * t;
      const checkY = targetPos.y + dy * t;
      const checkZ = targetPos.z + dz * t;
      
      // 1. Terrain collision check
      const terrainY = getTerrainHeight(checkX, checkZ);
      if (checkY < terrainY + 0.3) {
        targetRadius = maxRadius * Math.max(0.15, t - 0.08);
        break;
      }
      
      // 2. Tree trunk collision check
      let hitTree = false;
      for (const tree of treePositions) {
        const tdx = checkX - tree.x;
        const tdz = checkZ - tree.z;
        const tdist = Math.sqrt(tdx * tdx + tdz * tdz);
        const treeBaseY = getTerrainHeight(tree.x, tree.z);
        if (tdist < 0.6 && checkY > treeBaseY && checkY < treeBaseY + 4.0) {
          targetRadius = maxRadius * Math.max(0.15, t - 0.08);
          hitTree = true;
          break;
        }
      }
      if (hitTree) break;
    }
    
    // ── MATHEMATICAL SAFETY NET (PREVENTS ANY UNDERGROUND CLIPPING) ──
    const camTargetQuat = new THREE.Quaternion().setFromUnitVectors(
      new THREE.Vector3(0, 1, 0), terrainNormal
    );
    
    let testOffset = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch) * targetRadius,
      Math.sin(pitch) * targetRadius,
      Math.cos(yaw) * Math.cos(pitch) * targetRadius
    ).applyQuaternion(camTargetQuat);
    
    let checkPos = new THREE.Vector3().copy(targetPos).add(testOffset);
    let terrainHeightAtCam = getTerrainHeight(checkPos.x, checkPos.z);
    
    // Smoothly decrease targetRadius if camera is calculated to be below terrain + buffer
    let safetyCounter = 0;
    while (targetRadius > 1.2 && checkPos.y < terrainHeightAtCam + 0.4 && safetyCounter < 15) {
      targetRadius -= 0.3;
      testOffset.set(
        Math.sin(yaw) * Math.cos(pitch) * targetRadius,
        Math.sin(pitch) * targetRadius,
        Math.cos(yaw) * Math.cos(pitch) * targetRadius
      ).applyQuaternion(camTargetQuat);
      checkPos.copy(targetPos).add(testOffset);
      terrainHeightAtCam = getTerrainHeight(checkPos.x, checkPos.z);
      safetyCounter++;
    }
    
    // ── SMOOTH ASYMMETRIC RADIUS LERPING (FAST IN, SMOOTH OUT) ──
    if (targetRadius < currentRadius) {
      // Zooming in (collision): extremely fast to prevent clipping, with a micro-smoothing
      currentRadius += (targetRadius - currentRadius) * 28 * dt;
      if (currentRadius < targetRadius) currentRadius = targetRadius; // Physical safety limit
    } else {
      // Zooming out (cleared collision): smooth, elegant glide back to target
      currentRadius += (targetRadius - currentRadius) * 6 * dt;
    }
    
    const finalOffset = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch) * currentRadius,
      Math.sin(pitch) * currentRadius,
      Math.cos(yaw) * Math.cos(pitch) * currentRadius
    ).applyQuaternion(camTargetQuat);
    
    camera.position.copy(targetPos).add(finalOffset);
    camera.up.copy(terrainNormal); // Tilt camera to match the side rotation
    camera.lookAt(targetPos);

    renderer.render(scene, camera);
  }

  animate();

  // ── Resize ───────────────────────────────────────────────
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
