<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low Poly World — Built with Hermes</title>
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML = '<div style="color:#ff3333;background:#111;padding:40px;font-family:monospace;z-index:9999;position:absolute;top:0;left:0;width:100%;height:100%;overflow:auto;"><h2>JavaScript Error:</h2><pre>' + e.message + '\nat ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n\nStack:\n' + (e.error ? e.error.stack : 'N/A') + '</pre></div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML = '<div style="color:#ff3333;background:#111;padding:40px;font-family:monospace;z-index:9999;position:absolute;top:0;left:0;width:100%;height:100%;overflow:auto;"><h2>Unhandled Promise Rejection:</h2><pre>' + e.reason + '</pre></div>';
    });
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #ui {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      color: #fff; font-size: 14px;
      background: rgba(0,0,0,0.5); padding: 16px 22px;
      border-radius: 12px; backdrop-filter: blur(8px);
    }
    #ui h1 { font-size: 18px; margin-bottom: 6px; font-weight: 600; }
    #ui p { opacity: 0.7; font-size: 13px; line-height: 1.5; }
    #ui kbd {
      background: #fff2; padding: 2px 8px; border-radius: 4px;
      font-family: monospace; font-size: 12px;
    }
    #crosshair {
      position: fixed;
      top: 40%; /* slightly above center, positioned perfectly above Bob's head! */
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      pointer-events: none;
      z-index: 100;
      display: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: #ffffff;
      box-shadow: 0px 0px 2px rgba(0,0,0,0.8);
    }
    /* Horizontal crosshair line */
    #crosshair::before {
      top: 5px;
      left: 0;
      width: 12px;
      height: 2px;
    }
    /* Vertical crosshair line */
    #crosshair::after {
      top: 0;
      left: 5px;
      width: 2px;
      height: 12px;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="ui">
    <h1>🌍 Low Poly World</h1>
    <p>
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &middot; <kbd>E</kbd> Climb Up<br/>
      <span id="sprint-key-label"><kbd>Ctrl</kbd></span> Run &middot; <kbd>Space</kbd> Jump<br/>
      <kbd>Shift</kbd> Switch Shiftlock Mode<br/>
      <kbd>Mouse</kbd> Look (Right-Click Drag without Shiftlock)
    </p>
    <div id="shiftlock-indicator" style="margin-top: 8px; font-size: 12px; font-weight: bold; color: #ffcc00; letter-spacing: 0.5px;">
      Shiftlock: Off (None)
    </div>
    
    <!-- Beautiful low-poly styled settings panel! -->
    <div style="margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px;">
      <h3 style="font-size: 13px; margin-bottom: 8px; color: #e0f7fa;">⚙️ Settings</h3>
      
      <!-- Sensitivity Bar -->
      <div style="margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; opacity: 0.8; margin-bottom: 3px;">
          <span>Look Sensitivity:</span>
          <span id="sens-val">1.0x</span>
        </div>
        <input type="range" id="sens-slider" min="0.2" max="3.0" step="0.1" value="1.0" 
               style="width: 100%; accent-color: #ffcc00; cursor: pointer; background: rgba(255,255,255,0.2); height: 5px; border-radius: 3px; appearance: none; outline: none;">
      </div>
      
      <!-- Sprint Key OS Toggle -->
      <div>
        <div style="font-size: 12px; opacity: 0.8; margin-bottom: 4px;">Keyboard Layout:</div>
        <div style="display: flex; gap: 6px;">
          <button id="layout-win-btn" style="flex: 1; padding: 4px; font-size: 11px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; background: #ffcc00; color: #111; outline: none; transition: 0.2s;">Windows (Ctrl)</button>
          <button id="layout-mac-btn" style="flex: 1; padding: 4px; font-size: 11px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; background: rgba(255,255,255,0.15); color: #fff; outline: none; transition: 0.2s;">macOS (Control)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Load Three.js with robust CDN fallbacks (essential when jsDelivr is blocked by DNS/adblockers) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      console.warn('jsDelivr failed to load Three.js, attempting unpkg fallback...');
      document.write('<script src="https://unpkg.com/three@0.164.1/build/three.min.js"><\/script>');
    }
  </script>
  <script>
    if (typeof THREE === 'undefined') {
      console.warn('unpkg failed to load Three.js, attempting cdnjs fallback...');
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>

  <script>

  // ── Scene Setup ──────────────────────────────────────────
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7ec8e3);
  scene.fog = new THREE.FogExp2(0x7ec8e3, 0.008);

  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  // ── Lights ───────────────────────────────────────────────
  const sun = new THREE.DirectionalLight(0xfff4e0, 2);
  sun.position.set(50, 80, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 400;
  sun.shadow.camera.left = -200;
  sun.shadow.camera.right = 200;
  sun.shadow.camera.top = 200;
  sun.shadow.camera.bottom = -200;
  scene.add(sun);

  scene.add(new THREE.HemisphereLight(0x87ceeb, 0x3a7d2c, 0.6));
  scene.add(new THREE.AmbientLight(0x404060, 0.3));

  // ── Low-Poly Terrain ─────────────────────────────────────
  const terrainSize = 400;
  const terrainSegs = 80;
  const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegs, terrainSegs);
  const verts = terrainGeo.attributes.position;
  for (let i = 0; i < verts.count; i++) {
    const x = verts.getX(i), y = verts.getY(i);
    const dist = Math.sqrt(x * x + y * y);
    let h = (Math.sin(x * 0.05) * Math.cos(y * 0.07) * 3 +
             Math.sin(x * 0.12 + y * 0.09) * 2 +
             Math.random() * 0.3);
    // Flatten center area for player start
    if (dist < 10) h *= dist / 10;

    // Snowy Mountains Biome creation
    const dx = x - 120;
    const dy = y - 120;
    const distToPeak = Math.sqrt(dx * dx + dy * dy);
    if (distToPeak < 130) {
      const t = 1 - distToPeak / 130;
      let mountH = Math.pow(t, 1.8) * 75;
      
      // Cliff terraces
      if (distToPeak > 40 && distToPeak < 70) {
        const cliffFactor = (distToPeak - 40) / 30; // 0 to 1
        mountH -= Math.sin(cliffFactor * Math.PI) * 12;
      }
      h = Math.max(h, mountH);
    }

    verts.setZ(i, h);
  }
  terrainGeo.computeVertexNormals();

  // Low-poly coloring by height & location (Snowy Mountains Biome)
  const colors = [];
  for (let i = 0; i < verts.count; i++) {
    const x = verts.getX(i);
    const y = verts.getY(i);
    const h = verts.getZ(i);
    let c;
    
    // Check if vertex lies in the Snowy Mountains biome quadrant
    if (x > 30 && y > 30) {
      if (h > 22) {
        c = new THREE.Color(0xffffff); // Pure white snow caps
      } else if (h > 14) {
        c = new THREE.Color(0xdcdcdc); // Rocky snowy gray
      } else if (h > 6) {
        c = new THREE.Color(0x7a7f80); // Slate mountain gray
      } else if (h > 1.5) {
        c = new THREE.Color(0x3a5d38); // Dark evergreen/pine green
      } else {
        c = new THREE.Color(0x4a7c3f); // Normal valley grass
      }
    } else {
      // Normal biome coloring
      if (h < -1.5) c = new THREE.Color(0x5a3a1a);    // low ground
      else if (h < 0) c = new THREE.Color(0x4a7c3f);     // grass
      else if (h < 2) c = new THREE.Color(0x5cb85c);     // light grass
      else if (h < 4) c = new THREE.Color(0x7bc950);     // high grass
      else c = new THREE.Color(0x8fbc8f);                // hill top
    }
    colors.push(c.r, c.g, c.b);
  }
  terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const terrainMat = new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, roughness: 0.9
  });
  const terrain = new THREE.Mesh(terrainGeo, terrainMat);
  terrain.rotation.x = -Math.PI / 2;
  terrain.receiveShadow = true;
  scene.add(terrain);

  // ── Water (flat blue plane) ──────────────────────────────
  const water = new THREE.Mesh(
    new THREE.CircleGeometry(300, 5),
    new THREE.MeshStandardMaterial({ color: 0x5b91c6, flatShading: true, transparent: true, opacity: 0.8 })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = -2;
  scene.add(water);

  // ── Low-Poly Tree Generator ──────────────────────────────
  function createTree(x, z) {
    const g = new THREE.Group();

    // Trunk sits ON the terrain, not at center
    const trunkH = 0.8 + Math.random() * 0.8;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.20, trunkH, 5),
      new THREE.MeshStandardMaterial({ color: 0x8b5a2b, flatShading: true })
    );
    trunk.position.y = trunkH / 2;
    trunk.castShadow = true;
    g.add(trunk);

    // Foliage layers
    const foliagePalettes = [0x2d8b4a, 0x3aa85e, 0x2e7d32, 0x4caf50, 0x388e3c];
    const r1 = 0.9 + Math.random() * 0.3;
    const h1 = r1 * 1.4;
    const ry = Math.random() * Math.PI * 2;

    const mat1 = new THREE.MeshStandardMaterial({
      color: foliagePalettes[Math.floor(Math.random() * foliagePalettes.length)],
      flatShading: true
    });
    const cone1 = new THREE.Mesh(new THREE.ConeGeometry(r1, h1, 5 + Math.floor(Math.random() * 3)), mat1);
    cone1.position.y = 0.15 + h1 / 2; // ponytail: leaves near ground but not touching
    cone1.rotation.y = ry;
    cone1.castShadow = true;
    g.add(cone1);

    const r2 = r1 * 0.8;
    const h2 = h1 * 0.8;
    const mat2 = new THREE.MeshStandardMaterial({
      color: foliagePalettes[Math.floor(Math.random() * foliagePalettes.length)],
      flatShading: true
    });
    const cone2 = new THREE.Mesh(new THREE.ConeGeometry(r2, h2, 5 + Math.floor(Math.random() * 3)), mat2);
    cone2.position.y = cone1.position.y + h1 * 0.5;
    cone2.rotation.y = ry;
    cone2.castShadow = true;
    g.add(cone2);

    // Position tree so its base sits on the terrain
    const ty = getTerrainHeight(x, z);
    g.position.set(x, ty, z);

    // Rotate tree to match the terrain normal with a gentle tilt so it grows mostly upwards (not bugged/falling over)
    const normal = getTerrainNormal(x, z);
    const dampedNormal = new THREE.Vector3(normal.x * 0.2, normal.y, normal.z * 0.2).normalize();
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dampedNormal);

    return g;
  }

  // ── Utility: get terrain height at (x,z) with bilinear interpolation ─
  function getTerrainHeight(x, z) {
    const half = terrainSize / 2;
    const seg = terrainSize / terrainSegs;
    const col = (x + half) / seg;
    const row = (z + half) / seg;
    const ci = Math.floor(col), ri = Math.floor(row);
    const cf = col - ci, rf = row - ri;
    const ci2 = Math.min(ci + 1, terrainSegs);
    const ri2 = Math.min(ri + 1, terrainSegs);
    const clamp = (i, j) => {
      if (i < 0 || i > terrainSegs || j < 0 || j > terrainSegs) return 0;
      return verts.getZ(j * (terrainSegs + 1) + i);
    };
    const h00 = clamp(ci, ri), h10 = clamp(ci2, ri);
    const h01 = clamp(ci, ri2), h11 = clamp(ci2, ri2);
    const h0 = h00 * (1 - cf) + h10 * cf;
    const h1 = h01 * (1 - cf) + h11 * cf;
    return h0 * (1 - rf) + h1 * rf;
  }

    // ── Terrain normal: tilt player to match slope ─────────────
  function getTerrainNormal(x, z) {
    const s = 0.8; // wider sample = more stable normals
    const hl = getTerrainHeight(x - s, z);
    const hr = getTerrainHeight(x + s, z);
    const hf = getTerrainHeight(x, z - s);
    const hb = getTerrainHeight(x, z + s);
    const dx = (hr - hl) / (s * 2);
    const dz = (hf - hb) / (s * 2);
    return new THREE.Vector3(-dx, 1, dz).normalize();
  }

  // ── Ladders and Pathways Definitions ──────────────────────
  const laddersData = [];
  const pathwaysData = [];

  function createLadder(x, yMin, yMax, z, rotationY = 0) {
    const g = new THREE.Group();
    const height = yMax - yMin;
    const midY = yMin + height / 2;
    
    const railMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, flatShading: true, roughness: 0.9 });
    const rungMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, flatShading: true, roughness: 0.8 });
    
    // Left side rail
    const railL = new THREE.Mesh(new THREE.BoxGeometry(0.1, height, 0.1), railMat);
    railL.position.set(-0.35, 0, 0);
    railL.castShadow = true;
    railL.receiveShadow = true;
    g.add(railL);
    
    // Right side rail
    const railR = new THREE.Mesh(new THREE.BoxGeometry(0.1, height, 0.1), railMat);
    railR.position.set(0.35, 0, 0);
    railR.castShadow = true;
    railR.receiveShadow = true;
    g.add(railR);
    
    // Rungs spaced 0.4 units apart
    const spacing = 0.4;
    const rungsCount = Math.floor(height / spacing);
    for (let i = 0; i <= rungsCount; i++) {
      const rungY = -height / 2 + i * spacing;
      const rung = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.6, 4), rungMat);
      rung.rotation.z = Math.PI / 2;
      rung.position.set(0, rungY, 0);
      rung.castShadow = true;
      rung.receiveShadow = true;
      g.add(rung);
    }
    
    g.position.set(x, midY, z);
    g.rotation.y = rotationY;
    scene.add(g);
    
    laddersData.push({ x, z, yMin, yMax });
  }

  function createPathway(x, y, z, rx, ry, rz, width = 2.8, length = 6.0, isCloudPath = false) {
    const g = new THREE.Group();
    
    // Cloud platforms are styled in highly visible glowing low-poly orange (matching user's diagram!)
    const woodColor = isCloudPath ? 0xff7f00 : 0x6e473b;
    const roughness = isCloudPath ? 0.3 : 0.9;
    const metalness = isCloudPath ? 0.5 : 0.0;
    
    const woodMat = new THREE.MeshStandardMaterial({ 
      color: woodColor, 
      flatShading: true, 
      roughness: roughness,
      metalness: metalness
    });
    const supportMat = new THREE.MeshStandardMaterial({ 
      color: isCloudPath ? 0xcc6600 : 0x4a312a, 
      flatShading: true 
    });
    
    // Horizontal planks
    const plankGeo = new THREE.BoxGeometry(width, 0.15, length);
    const plank = new THREE.Mesh(plankGeo, woodMat);
    plank.castShadow = !isCloudPath;
    plank.receiveShadow = !isCloudPath;
    g.add(plank);
    
    // Left Support Beam
    const beamL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, length), supportMat);
    beamL.position.set(-width / 2 + 0.25, -0.2, 0);
    beamL.castShadow = !isCloudPath;
    g.add(beamL);
    
    // Right Support Beam
    const beamR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, length), supportMat);
    beamR.position.set(width / 2 - 0.25, -0.2, 0);
    beamR.castShadow = !isCloudPath;
    g.add(beamR);
    
    g.position.set(x, y, z);
    g.rotation.set(rx, ry, rz);
    
    // If it is a cloud path, hide the solid rectangular meshes completely!
    // Bob will walk on flat invisible hitboxes embedded seamlessly in the fluffy clouds.
    if (isCloudPath) {
      g.visible = false;
    }
    
    scene.add(g);
    
    pathwaysData.push({ x, y, z, width, length, rx, ry, rz });
  }

  // ── Scatter Trees ────────────────────────────────────────
  const treePositions = [];
  for (let i = 0; i < 600; i++) {
    const tx = (Math.random() - 0.5) * 365;
    const tz = (Math.random() - 0.5) * 365;
    const td = Math.sqrt(tx * tx + tz * tz);
    if (td < 5) continue; // keep center clear
    if (td < 80 && Math.random() > 0.7) continue;

    const terrainH = getTerrainHeight(tx, tz);
    const normal = getTerrainNormal(tx, tz);
    
    // Enforce spawning rules:
    // 1. Cannot spawn on water (height <= -1.5)
    // 2. Cannot spawn on steep ground (slope > 30 degrees, normal.y < 0.866)
    if (terrainH > -1.5 && normal.y >= 0.866) {
      scene.add(createTree(tx, tz));
      treePositions.push({ x: tx, z: tz });
    }
  }

  // ── Spawn Pathways, Ladders & Peak Flag ──────────────────
  // Lower pathway ramp leading from mountain base upwards
  createPathway(72, getTerrainHeight(72, -72) + 0.1, -72, 0.16, -Math.PI / 4, 0);
  createPathway(80, getTerrainHeight(80, -80) + 0.1, -80, 0.18, -Math.PI / 4, 0);
  createPathway(88, getTerrainHeight(88, -88) + 0.1, -88, 0.20, -Math.PI / 4, 0);

  // First climbable ladder scaling the lower cliff terrace
  createLadder(95.5, 28.75, 45.83, -95.5, -Math.PI / 4);

  // Mid-level transition pathway and bridge
  createPathway(101, getTerrainHeight(101, -101) + 0.1, -101, 0.05, -Math.PI / 4, 0);
  createPathway(107, getTerrainHeight(107, -107) + 0.1, -107, 0.08, -Math.PI / 4, 0);

  // Second climbable ladder scaling the final vertical summit cliff (scaled by 75/36)
  createLadder(112.5, 45.42, 64.58, -112.5, -Math.PI / 4);

  // Upper summit pathways leading to the very peak
  createPathway(117, getTerrainHeight(117, -117) + 0.1, -117, 0.12, -Math.PI / 4, 0);
  createPathway(123, getTerrainHeight(123, -123) + 0.1, -123, 0.08, -Math.PI / 4, 0);

  // Summit Flag pole and flag waving on the mountain top
  const peakH = getTerrainHeight(130, -130);
  
  const flagPole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.08, 6.0, 6),
    new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 })
  );
  flagPole.position.set(130, peakH + 3.0, -130);
  flagPole.castShadow = true;
  flagPole.receiveShadow = true;
  scene.add(flagPole);

  const flagGroup = new THREE.Group();
  
  // Outer border & fabric of flag
  const flagFabric = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 1.0, 0.06),
    new THREE.MeshStandardMaterial({ color: 0xff3333, flatShading: true, roughness: 0.6 })
  );
  flagFabric.position.set(1.0, 0, 0);
  flagFabric.castShadow = true;
  flagGroup.add(flagFabric);

  // Golden low-poly crown/star dodecahedron emblem
  const emblem = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.3, 0),
    new THREE.MeshStandardMaterial({ color: 0xffd700, flatShading: true, roughness: 0.3, metalness: 0.8 })
  );
  emblem.position.set(1.0, 0, 0.04);
  emblem.castShadow = true;
  flagGroup.add(emblem);

  flagGroup.position.set(130, peakH + 5.0, -130);
  scene.add(flagGroup);

  // ── Above the Clouds Biome (Visual Cloud Generator & Spawning) ──
  function createVisualCloudPlatform(x, y, z, width, length) {
    const g = new THREE.Group();
    const cloudMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      flatShading: true,
      transparent: true,
      opacity: 0.96,
      roughness: 0.9
    });
    
    // Spawn overlapping low-poly puffs around the border and slightly overlapping the top
    const puffCount = 14;
    for (let i = 0; i < puffCount; i++) {
      const angle = (i / puffCount) * Math.PI * 2;
      const radiusX = (width / 2) * (0.8 + Math.random() * 0.25);
      const radiusZ = (length / 2) * (0.8 + Math.random() * 0.25);
      
      const px = Math.cos(angle) * radiusX;
      const pz = Math.sin(angle) * radiusZ;
      const py = -0.3 + (Math.random() - 0.5) * 0.3; // overlapping the flat hitbox
      
      const size = 2.0 + Math.random() * 1.5;
      const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 1), cloudMat);
      puff.position.set(px, py, pz);
      puff.castShadow = true;
      puff.receiveShadow = true;
      g.add(puff);
    }
    
    // Cloud underside fluffy base
    for (let i = 0; i < 5; i++) {
      const size = 3.0 + Math.random() * 2.0;
      const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 1), cloudMat);
      puff.position.set((Math.random() - 0.5) * width * 0.4, -1.0, (Math.random() - 0.5) * length * 0.4);
      g.add(puff);
    }
    
    g.position.set(x, y - 1.9, z);
    scene.add(g);
  }

  // 45% chance to spawn the secret sky biome in any given session!
  const hasCloudBiome = Math.random() < 0.45;
  if (hasCloudBiome) {
    console.log("☁️ Secret cloud biome spawned at (-110, -110)!");
    const indicator = document.createElement('div');
    indicator.style.marginTop = '6px';
    indicator.style.fontSize = '12px';
    indicator.style.color = '#e0f7fa';
    indicator.style.fontWeight = 'bold';
    indicator.textContent = '☁️ Secret: Sky Clouds Biome spawned!';
    const uiBox = document.getElementById('ui');
    if (uiBox) uiBox.appendChild(indicator);

    // 1. Spans a massive vertical ladder from ground level to 48.0 height
    const groundHeight = getTerrainHeight(-110, -110);
    createLadder(-110, groundHeight, 48.0, -110, 0);

    // 2. Spawn 3 connected flat ground hitbox pathways (orange platforms) at height 48
    // Width and Length acts as the physical collision box!
    createPathway(-110, 48.0, -110, 0, 0, 0, 10, 10, true);
    createPathway(-110, 48.0, -120, 0, 0, 0, 8, 8, true);
    createPathway(-100, 48.0, -110, 0, 0, 0, 8, 8, true);

    // 3. Cover them with fluffy visual cloud puffs (which overlap the flat hitbox)
    createVisualCloudPlatform(-110, 48.0, -110, 10, 10);
    createVisualCloudPlatform(-110, 48.0, -120, 8, 8);
    createVisualCloudPlatform(-100, 48.0, -110, 8, 8);
  }

  // ── Clouds ───────────────────────────────────────────────
  function createCloud() {
    const g = new THREE.Group();
    const count = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
      const cb = new THREE.Mesh(
        new THREE.DodecahedronGeometry(2 + Math.random() * 3, 1),
        new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.9 })
      );
      cb.position.set(i * 3 - count, Math.random() * 1, Math.random() * 2);
      g.add(cb);
    }
    g.position.set(
      (Math.random() - 0.5) * 200,
      30 + Math.random() * 15,
      (Math.random() - 0.5) * 200
    );
    g.userData.speed = 0.2 + Math.random() * 0.5;
    return g;
  }
  const clouds = [];
  for (let i = 0; i < 12; i++) {
    const cloud = createCloud();
    clouds.push(cloud);
    scene.add(cloud);
  }

  // ── Player Character ─────────────────────────────────────
  const player = new THREE.Group();
  player.scale.set(0.5, 0.5, 0.5);
  const PLAYER_RADIUS = 0.2;   // collision radius
  const PLAYER_HEIGHT = 1.1;   // collision height (ground to hat top)
  const FEET_OFFSET = 0.0;     // hover clearance so feet don't clip into slopes

  // Body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.2, 0.4),
    new THREE.MeshStandardMaterial({ color: 0x4488cc, flatShading: true })
  );
  body.position.y = 0.6;
  body.castShadow = true;
  player.add(body);

  // Create a cute :3 face texture using Canvas
  const faceCanvas = document.createElement('canvas');
  faceCanvas.width = 128;
  faceCanvas.height = 128;
  const fCtx = faceCanvas.getContext('2d');

  // Face background (skin tone matching skinMat color #ffcc99)
  fCtx.fillStyle = '#ffcc99';
  fCtx.fillRect(0, 0, 128, 128);

  // Cute eyes
  fCtx.fillStyle = '#222222';
  fCtx.beginPath();
  fCtx.arc(38, 52, 6, 0, Math.PI * 2);
  fCtx.fill();
  fCtx.beginPath();
  fCtx.arc(90, 52, 6, 0, Math.PI * 2);
  fCtx.fill();

  // Cute :3 cat smile mouth
  fCtx.strokeStyle = '#222222';
  fCtx.lineWidth = 5;
  fCtx.lineCap = 'round';
  
  // Left smile loop
  fCtx.beginPath();
  fCtx.arc(50, 76, 11, 0, Math.PI, false);
  fCtx.stroke();
  
  // Right smile loop
  fCtx.beginPath();
  fCtx.arc(72, 76, 11, 0, Math.PI, false);
  fCtx.stroke();

  const faceTexture = new THREE.CanvasTexture(faceCanvas);
  faceTexture.colorSpace = THREE.SRGBColorSpace;

  // Materials array for the 6 faces of the head [right, left, top, bottom, front, back]
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, flatShading: true });
  const faceMat = new THREE.MeshStandardMaterial({ map: faceTexture, flatShading: true });
  
  const headMats = [
    skinMat, // right (+X)
    skinMat, // left (-X)
    skinMat, // top (+Y)
    skinMat, // bottom (-Y)
    faceMat, // front (+Z) - facing forward locally
    skinMat  // back (-Z)
  ];

  // Head
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.5, 0.5),
    headMats
  );
  head.position.y = 1.45;
  head.castShadow = true;
  player.add(head);

  player.position.set(0, getTerrainHeight(0, 0) + FEET_OFFSET, 0);
  scene.add(player);

  // ── Controls ─────────────────────────────────────────────
  const keys = {};
  const velocity = new THREE.Vector3();
  let yaw = 0, pitch = 0;
  let isLocked = false;
  let shiftlockMode = 0; // 0 = None, 1 = Smooth Lock, 2 = Instant Lock
  let cameraZoomDistance = 6.0; // Dynamic zoom distance controlled by scroll wheel!
  let currentRadius = 6.0;
  let playerYaw = 0; // Store the persistent, smooth player yaw to prevent 360 spins!
  let isRightMouseDown = false;

  // Scroll wheel event listener to zoom in and out
  document.addEventListener('wheel', e => {
    // Zoom in or out (e.deltaY is positive when scrolling down / zooming out)
    cameraZoomDistance += e.deltaY * 0.005;
    // Keep bounded between 2.0 (close up third person) and 15.0 (wide environment view)
    cameraZoomDistance = Math.max(2.0, Math.min(15.0, cameraZoomDistance));
  });

  // Settings Wiring: Look Sensitivity and Keyboard Layout OS Toggle
  let mouseSensitivity = 1.0;
  let isMacLayout = false;

  // Auto detect macOS
  const ua = navigator.userAgent.toLowerCase();
  const plat = navigator.platform.toLowerCase();
  if (ua.includes('mac') || plat.includes('mac')) {
    isMacLayout = true;
  }

  function updateLayoutUI() {
    const label = document.getElementById('sprint-key-label');
    const winBtn = document.getElementById('layout-win-btn');
    const macBtn = document.getElementById('layout-mac-btn');
    
    if (isMacLayout) {
      if (label) label.innerHTML = '<kbd>Control</kbd>';
      if (winBtn) {
        winBtn.style.background = 'rgba(255,255,255,0.15)';
        winBtn.style.color = '#fff';
      }
      if (macBtn) {
        macBtn.style.background = '#ffcc00';
        macBtn.style.color = '#111';
      }
    } else {
      if (label) label.innerHTML = '<kbd>Ctrl</kbd>';
      if (winBtn) {
        winBtn.style.background = '#ffcc00';
        winBtn.style.color = '#111';
      }
      if (macBtn) {
        macBtn.style.background = 'rgba(255,255,255,0.15)';
        macBtn.style.color = '#fff';
      }
    }
  }

  // Wire buttons & slider after document DOM is ready (in script directly)
  window.addEventListener('DOMContentLoaded', () => {
    const sensSlider = document.getElementById('sens-slider');
    const sensVal = document.getElementById('sens-val');
    
    if (sensSlider && sensVal) {
      sensSlider.addEventListener('input', () => {
        mouseSensitivity = parseFloat(sensSlider.value);
        sensVal.textContent = mouseSensitivity.toFixed(1) + 'x';
      });
    }

    const winBtn = document.getElementById('layout-win-btn');
    const macBtn = document.getElementById('layout-mac-btn');

    if (winBtn && macBtn) {
      winBtn.addEventListener('click', () => {
        isMacLayout = false;
        updateLayoutUI();
      });
      macBtn.addEventListener('click', () => {
        isMacLayout = true;
        updateLayoutUI();
      });
    }

    updateLayoutUI();
  });

  // Intercept browser context menu to allow smooth right-click camera dragging
  document.addEventListener('contextmenu', e => {
    e.preventDefault();
  });

  let lastMouseX = 0;
  let lastMouseY = 0;

  document.addEventListener('mousedown', e => {
    if (e.button === 2) {
      isRightMouseDown = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      // Only lock the pointer on right-click mousedown if Shiftlock is OFF (None Mode)
      if (shiftlockMode === 0) {
        const p = renderer.domElement.requestPointerLock();
        if (p && typeof p.catch === 'function') {
          p.catch(err => {
            console.warn("Pointer lock request denied on right-click:", err);
          });
        }
      }
    }
  });

  document.addEventListener('mouseup', e => {
    if (e.button === 2) {
      isRightMouseDown = false;
      // Only release pointer lock on right-click mouseup if Shiftlock is OFF (None Mode)
      if (shiftlockMode === 0) {
        if (document.pointerLockElement === renderer.domElement) {
          document.exitPointerLock();
        }
      }
    }
  });

  function updateShiftlockUI() {
    const el = document.getElementById('shiftlock-indicator');
    const ch = document.getElementById('crosshair');
    if (!el) return;
    if (shiftlockMode === 0) {
      el.textContent = 'Shiftlock: Off (None)';
      el.style.color = '#ffcc00';
      if (ch) ch.style.display = 'none'; // Hide crosshair
      if (document.pointerLockElement === renderer.domElement) {
        document.exitPointerLock();
      }
    } else {
      if (shiftlockMode === 1) {
        el.textContent = 'Shiftlock: Mode 1 (Smooth)';
        el.style.color = '#00ffcc';
      } else if (shiftlockMode === 2) {
        el.textContent = 'Shiftlock: Mode 2 (Instant)';
        el.style.color = '#ff3366';
      }
      if (ch) ch.style.display = 'block'; // Show crosshair!
      
      // Catch pointer lock promise rejection to avoid "SecurityError" overlay
      const p = renderer.domElement.requestPointerLock();
      if (p && typeof p.catch === 'function') {
        p.catch(err => {
          console.warn("Pointer lock request denied (expected during rapid cycling/cooldown):", err);
        });
      }
    }
  }

  document.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    
    // Cycle Shiftlock modes on Shift press (without trigger repetition when holding key)
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
      if (!e.repeat) {
        shiftlockMode = (shiftlockMode + 1) % 3;
        updateShiftlockUI();
      }
    }
  });
  
  document.addEventListener('keyup', e => { keys[e.code] = false; });

  // Clear keys on window blur to prevent infinite walking stuck keys
  window.addEventListener('blur', () => {
    for (const key in keys) {
      keys[key] = false;
    }
    isRightMouseDown = false;
  });

  renderer.domElement.addEventListener('click', () => {
    // Only lock pointer on click if Shiftlock is ON
    if (shiftlockMode > 0) {
      const p = renderer.domElement.requestPointerLock();
      if (p && typeof p.catch === 'function') {
        p.catch(err => {
          console.warn("Pointer lock request denied on click:", err);
        });
      }
    }
  });

  let justLocked = false;
  let ignoreMovements = false;

  document.addEventListener('pointerlockchange', () => {
    const wasLocked = isLocked;
    isLocked = document.pointerLockElement === renderer.domElement;
    if (isLocked) {
      if (!wasLocked) {
        justLocked = true;
      }
      if (shiftlockMode === 0 && !isRightMouseDown) {
        ignoreMovements = true;
        document.exitPointerLock();
      }
    } else {
      ignoreMovements = false;
      if (shiftlockMode === 0) {
        isRightMouseDown = false;
      }
    }
  });

  document.addEventListener('mousemove', e => {
    if (ignoreMovements) {
      return;
    }
    if (justLocked) {
      justLocked = false;
      return;
    }
    // Shiftlock is ON: Mouse moves camera directly (requires pointer lock)
    if (shiftlockMode > 0) {
      if (!isLocked) return;
      yaw -= e.movementX * 0.002 * mouseSensitivity;
      pitch = Math.max(-0.6, Math.min(1.2, pitch + e.movementY * 0.002 * mouseSensitivity));
    } 
    // Shiftlock is OFF: Dragging mouse with RIGHT CLICK rotates camera
    else {
      if (!isLocked && !isRightMouseDown) return;
      
      let dx = 0;
      let dy = 0;
      
      if (isLocked) {
        dx = e.movementX;
        dy = e.movementY;
      } else {
        // If not locked, compute delta manually using clientX/clientY
        dx = e.clientX - lastMouseX;
        dy = e.clientY - lastMouseY;
        
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        
        // Ignore massive delta jumps (like snaps during transition)
        if (Math.abs(dx) > 150 || Math.abs(dy) > 150) {
          return;
        }
      }
      
      yaw -= dx * 0.0025 * mouseSensitivity;
      pitch = Math.max(-0.6, Math.min(1.2, pitch + dy * 0.0025 * mouseSensitivity));
    }
  });

  // ── Game Loop ────────────────────────────────────────────
  const clock = new THREE.Clock();
  let vy = 0; // vertical velocity (jump)

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    // Clouds drift
    for (const c of clouds) {
      c.position.x += c.userData.speed * dt;
      if (c.position.x > 100) c.position.x = -100;
    }

    // Player movement
    const speed = keys['ControlLeft'] ? 12 : 6;
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

    const move = new THREE.Vector3();
    if (keys['KeyW'] || keys['ArrowUp']) move.add(forward);
    if (keys['KeyS'] || keys['ArrowDown']) move.sub(forward);
    if (keys['KeyA'] || keys['ArrowLeft']) move.sub(right);
    if (keys['KeyD'] || keys['ArrowRight']) move.add(right);

    if (move.length() > 0) {
      move.normalize();

    }

    // Check if current position is a steep slope (> 50 degrees)
    const currentSlopeNormal = getTerrainNormal(player.position.x, player.position.z);
    
    // Check if player is near any pathway
    let onPathwayCurrent = false;
    for (const path of pathwaysData) {
      const pdx = player.position.x - path.x;
      const pdz = player.position.z - path.z;
      const pdist = Math.sqrt(pdx * pdx + pdz * pdz);
      if (pdist < 3.8 && Math.abs(player.position.y - path.y) < 2.5) {
        onPathwayCurrent = true;
        break;
      }
    }
    
    // Also check if they are near a ladder
    let nearLadderCurrent = false;
    for (const ladder of laddersData) {
      const ldx = player.position.x - ladder.x;
      const ldz = player.position.z - ladder.z;
      const ldist = Math.sqrt(ldx * ldx + ldz * ldz);
      if (ldist < 1.2 && player.position.y >= ladder.yMin - 0.5 && player.position.y <= ladder.yMax + 0.8) {
        nearLadderCurrent = true;
        break;
      }
    }

    let isSliding = false;
    let slideX = 0, slideZ = 0;
    if (currentSlopeNormal.y < 0.6428 && !onPathwayCurrent && !nearLadderCurrent) {
      isSliding = true;
      slideX = currentSlopeNormal.x * 12.0;
      slideZ = currentSlopeNormal.z * 12.0;
    }

    if (isSliding) {
      velocity.x = move.x * speed * 0.1;
      velocity.z = move.z * speed * 0.1;
    } else {
      velocity.x = move.x * speed;
      velocity.z = move.z * speed;
    }

    // Move horizontally FIRST so we check terrain at the destination
    const oldX = player.position.x;
    const oldZ = player.position.z;
    const oldGroundY = getTerrainHeight(oldX, oldZ);

    player.position.x += (velocity.x + slideX) * dt;
    player.position.z += (velocity.z + slideZ) * dt;

    // Check if we are on a steep slope and trying to walk UP
    const newGroundY = getTerrainHeight(player.position.x, player.position.z);
    const slopeNormal = getTerrainNormal(player.position.x, player.position.z);
    
    // Slopes too high to climb: normal.y < 0.707 (i.e. > 45 degrees)
    if (slopeNormal.y < 0.707) {
      // Check if player is near any pathway
      let onPathway = false;
      for (const path of pathwaysData) {
        const pdx = player.position.x - path.x;
        const pdz = player.position.z - path.z;
        const pdist = Math.sqrt(pdx * pdx + pdz * pdz);
        if (pdist < 3.8 && Math.abs(player.position.y - path.y) < 2.5) {
          onPathway = true;
          break;
        }
      }
      
      // Also check if they are near a ladder
      let nearLadder = false;
      for (const ladder of laddersData) {
        const ldx = player.position.x - ladder.x;
        const ldz = player.position.z - ladder.z;
        const ldist = Math.sqrt(ldx * ldx + ldz * ldz);
        if (ldist < 1.2 && player.position.y >= ladder.yMin - 0.5 && player.position.y <= ladder.yMax + 0.8) {
          nearLadder = true;
          break;
        }
      }

      // If we are trying to go UP a steep slope and not on a path or ladder, block horizontal progress!
      if (!onPathway && !nearLadder && newGroundY > oldGroundY + 0.05) {
        player.position.x = oldX;
        player.position.z = oldZ;
      }
    }

    // Keep in bounds
    player.position.x = Math.max(-terrainSize/2 + 2, Math.min(terrainSize/2 - 2, player.position.x));
    player.position.z = Math.max(-terrainSize/2 + 2, Math.min(terrainSize/2 - 2, player.position.z));

    // Tree collisions (cylinder-based check around the trunks)
    const playerRadius = 0.2;
    const trunkCollisionRadius = 0.5; // Slightly larger than tree trunks for smooth navigation
    const minCollisionDist = playerRadius + trunkCollisionRadius;
    for (const tree of treePositions) {
      const dx = player.position.x - tree.x;
      const dz = player.position.z - tree.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < minCollisionDist) {
        // Push the player outward to prevent clipping
        const angle = Math.atan2(dz, dx);
        player.position.x = tree.x + Math.cos(angle) * minCollisionDist;
        player.position.z = tree.z + Math.sin(angle) * minCollisionDist;
      }
    }

    // ── Ladder Climbing & Gravity Check ───────────────────
    let isClimbing = false;
    let activeLadder = null;
    
    // Check if the player is horizontally and vertically within ladder bounds
    for (const ladder of laddersData) {
      const dx = player.position.x - ladder.x;
      const dz = player.position.z - ladder.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      
      if (dist < 1.1 && player.position.y >= ladder.yMin - 0.5 && player.position.y <= ladder.yMax + 0.8) {
        activeLadder = ladder;
        break;
      }
    }
    
    if (activeLadder) {
      // W or Up Arrow always offsets Bob forward, detaching him from the ladder!
      if (keys['KeyW'] || keys['ArrowUp']) {
        player.userData.isClimbingLadder = false;
        player.userData.climbDirection = 0;
        isClimbing = false;
        // Push Bob horizontally slightly in his look direction to offset him from the ladder
        player.position.x += forward.x * 2.0 * dt;
        player.position.z += forward.z * 2.0 * dt;
      } 
      // E Key pressed once auto starts climb UP (fast speed 6.5!)
      else if (keys['KeyE']) {
        player.userData.isClimbingLadder = true;
        player.userData.climbDirection = 1; // 1 = UP
      } 
      // S or Down Arrow pressed once auto starts climb DOWN (fast speed -6.5!)
      else if (keys['KeyS'] || keys['ArrowDown']) {
        player.userData.isClimbingLadder = true;
        player.userData.climbDirection = -1; // -1 = DOWN
      } 
      
      // Handle auto climbing state mechanics
      if (player.userData.isClimbingLadder) {
        isClimbing = true;
        if (player.userData.climbDirection === 1) {
          vy = 6.5; // Fast climbing!
        } else if (player.userData.climbDirection === -1) {
          vy = -6.5; // Fast descending!
        } else {
          vy = 0;
        }
      }
    } else {
      player.userData.isClimbingLadder = false;
      player.userData.climbDirection = 0;
    }

    // ── Cute Low-Poly Climb Animation ─────────────────────
    if (isClimbing) {
      // Bob wiggles body and bobs head like he's climbing rungs!
      const climbTime = clock.getElapsedTime() * 12;
      body.position.x = Math.sin(climbTime) * 0.12;
      body.position.y = 0.6 + Math.cos(climbTime * 2) * 0.08;
      
      head.position.x = Math.sin(climbTime) * 0.08;
      head.position.y = 1.45 + Math.cos(climbTime * 2) * 0.05;
    } else {
      // Reset to standard resting positions
      body.position.x = 0;
      body.position.y = 0.6;
      head.position.x = 0;
      head.position.y = 1.45;
    }
    
    // groundY is where the character's feet sit (group origin = feet)
    const groundY = getTerrainHeight(player.position.x, player.position.z);
    const terrainNormal = getTerrainNormal(player.position.x, player.position.z);

    // Platform collision check (for elevated pathways/clouds)
    let platformY = -999;
    for (const path of pathwaysData) {
      const pdx = player.position.x - path.x;
      const pdz = player.position.z - path.z;
      
      const sizeX = path.width / 2 + 0.35;
      const sizeZ = path.length / 2 + 0.35;
      
      const cosRY = Math.cos(-path.ry);
      const sinRY = Math.sin(-path.ry);
      const localX = pdx * cosRY - pdz * sinRY;
      const localZ = pdx * sinRY + pdz * cosRY;
      
      if (Math.abs(localX) < sizeX && Math.abs(localZ) < sizeZ) {
        // Player is horizontally inside the platform. Check if falling onto it
        if (player.position.y >= path.y - 0.25 && player.position.y <= path.y + 0.6) {
          platformY = path.y;
          break;
        }
      }
    }

    let landingY = groundY + FEET_OFFSET;
    let isStandingOnPlatform = false;
    if (platformY > groundY + FEET_OFFSET) {
      landingY = platformY;
      isStandingOnPlatform = true;
    }

    // Apply gravity only if not actively climbing a ladder
    if (!isClimbing) {
      if (player.position.y > landingY + 0.01 || isSliding) {
        vy -= 22 * dt;
        if (isSliding && vy > -8) {
          vy = -8; // ensure downward momentum
        }
      } else {
        vy = 0;
      }

      // Jump (only when feet are on landing surface, using a wider 0.35 threshold for sprint jumping, not sliding)
      if (keys['Space'] && vy === 0 && !isSliding && Math.abs(player.position.y - landingY) < 0.35) {
        vy = 8;
      }
    }

    player.position.y += vy * dt;

    // Anti fall-through: clamp to terrain or platform
    if (player.position.y < landingY) {
      player.position.y = landingY;
      if (vy < 0 && !isSliding) {
        vy = 0;
      }
    }

    if (shiftlockMode === 0) {
      // NONE MODE: Character turning is disabled unless moving
      if (move.length() > 0.01) {
        // Turn smoothly to face walking direction along shortest path
        const targetYaw = Math.atan2(move.x, move.z);
        let diff = targetYaw - playerYaw;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff)); // Shortest path
        playerYaw += diff * 10 * dt;
      }
    } else if (shiftlockMode === 1) {
      // SHIFTLOCK 1: Smooth lock to face camera direction along shortest path
      const targetYaw = yaw + Math.PI;
      let diff = targetYaw - playerYaw;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff)); // Shortest path
      playerYaw += diff * 10 * dt;
    } else if (shiftlockMode === 2) {
      // SHIFTLOCK 2: Instant lock to face camera direction
      playerYaw = yaw + Math.PI;
    }

    // Keep playerYaw normalized between [-PI, PI] to prevent any numerical drift
    playerYaw = Math.atan2(Math.sin(playerYaw), Math.cos(playerYaw));

    // Base orientation
    const yawQuat = new THREE.Quaternion().setFromAxisAngle(
      new THREE.Vector3(0, 1, 0), playerYaw
    );
    player.quaternion.copy(yawQuat); // Instantly copy the smooth target quaternion!

    // ── Spherical Camera Follow with Roblox-style Terrain & Obstacle Collision ──
    player.updateMatrixWorld(true); // Force matrix update to prevent camera snapping/jumping!
    const targetPos = new THREE.Vector3();
    head.getWorldPosition(targetPos); // Follow the exact world position of the head, adapting to slope tilts!

    const maxRadius = cameraZoomDistance; // Desired distance
    
    // Direction vector from target to camera (using pitch and yaw)
    // pitch acts as the elevation angle, yaw acts as the azimuthal angle
    const dx = Math.sin(yaw) * Math.cos(pitch) * maxRadius;
    const dy = Math.sin(pitch) * maxRadius;
    const dz = Math.cos(yaw) * Math.cos(pitch) * maxRadius;
    
    let targetRadius = maxRadius;
    const collisionSteps = 12;
    
    for (let i = 1; i <= collisionSteps; i++) {
      const t = i / collisionSteps;
      const checkX = targetPos.x + dx * t;
      const checkY = targetPos.y + dy * t;
      const checkZ = targetPos.z + dz * t;
      
      // 1. Terrain collision check
      const terrainY = getTerrainHeight(checkX, checkZ);
      if (checkY < terrainY + 0.08) {
        targetRadius = maxRadius * Math.max(0.15, t - 0.08);
        break;
      }
      
      // 2. Tree trunk collision check
      let hitTree = false;
      for (const tree of treePositions) {
        const tdx = checkX - tree.x;
        const tdz = checkZ - tree.z;
        const tdist = Math.sqrt(tdx * tdx + tdz * tdz);
        const treeBaseY = getTerrainHeight(tree.x, tree.z);
        if (tdist < 0.6 && checkY > treeBaseY && checkY < treeBaseY + 4.0) {
          targetRadius = maxRadius * Math.max(0.15, t - 0.08);
          hitTree = true;
          break;
        }
      }
      if (hitTree) break;
    }
    
    // ── MATHEMATICAL SAFETY NET (PREVENTS ANY UNDERGROUND CLIPPING) ──
    let testOffset = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch) * targetRadius,
      Math.sin(pitch) * targetRadius,
      Math.cos(yaw) * Math.cos(pitch) * targetRadius
    );
    
    let checkPos = new THREE.Vector3().copy(targetPos).add(testOffset);
    let terrainHeightAtCam = getTerrainHeight(checkPos.x, checkPos.z);
    
    // Smoothly decrease targetRadius if camera is calculated to be below terrain + buffer
    let safetyCounter = 0;
    while (targetRadius > 1.2 && checkPos.y < terrainHeightAtCam + 0.12 && safetyCounter < 15) {
      targetRadius -= 0.3;
      testOffset.set(
        Math.sin(yaw) * Math.cos(pitch) * targetRadius,
        Math.sin(pitch) * targetRadius,
        Math.cos(yaw) * Math.cos(pitch) * targetRadius
      );
      checkPos.copy(targetPos).add(testOffset);
      terrainHeightAtCam = getTerrainHeight(checkPos.x, checkPos.z);
      safetyCounter++;
    }
    
    // ── SMOOTH ASYMMETRIC RADIUS LERPING (FAST IN, SMOOTH OUT) ──
    if (targetRadius < currentRadius) {
      // Zooming in (collision): extremely fast to prevent clipping, with a micro-smoothing
      currentRadius += (targetRadius - currentRadius) * 28 * dt;
      if (currentRadius < targetRadius) currentRadius = targetRadius; // Physical safety limit
    } else {
      // Zooming out (cleared collision): smooth, elegant glide back to target
      currentRadius += (targetRadius - currentRadius) * 6 * dt;
    }
    
    const finalOffset = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch) * currentRadius,
      Math.sin(pitch) * currentRadius,
      Math.cos(yaw) * Math.cos(pitch) * currentRadius
    );
    
    camera.position.copy(targetPos).add(finalOffset);
    camera.up.set(0, 1, 0); // Keep camera upright (remove terrain normal tilt)
    camera.lookAt(targetPos);

    renderer.render(scene, camera);
  }

  animate();

  // ── Resize ───────────────────────────────────────────────
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
